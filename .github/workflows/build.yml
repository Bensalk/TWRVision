name: Build TWRVision IPK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Read the version number
        id: ver
        run: echo "version=$(python3 -c "import json; print(json.load(open('app/appinfo.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Build IPK
        run: python3 build_ipk.py

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" *.ipk --title "TWRVision $TAG" --notes "Install file for the TV. See INSTALL.md."
